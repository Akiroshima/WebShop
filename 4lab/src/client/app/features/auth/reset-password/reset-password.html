<app-auth-card
  overline="ПОЧТИ ГОТОВО"
  title="Новый пароль"
  subtitle="Придумайте пароль, который не угадает даже самый любопытный кот."
>
  <form class="reset-form" [formGroup]="form" (submit)="submit()">
    @if (!resetToken) {
      <div class="reset-form__banner" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>Ссылка восстановления недействительна. Начните восстановление заново.</span>
      </div>
    } @else if (serverError()) {
      <div class="reset-form__banner" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ serverError() }}</span>
      </div>
    }

    <label class="field">
      <span class="field__label">Новый пароль</span>
      <input
        class="mzk-input"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="new-password"
        placeholder="Минимум 8 символов"
        [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
      @if (form.controls.password.touched && passwordIssues().length) {
        <span class="field__error">Пароль: {{ passwordIssues()[0] }} и ещё {{ passwordIssues().length - 1 }}…</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Повторите пароль</span>
      <input
        class="mzk-input"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="confirm"
        autocomplete="new-password"
        placeholder="Ещё раз"
        [class.is-invalid]="form.controls.confirm.touched && form.hasError('fieldsMismatch')"
      />
      @if (form.controls.confirm.touched && form.hasError('fieldsMismatch')) {
        <span class="field__error">Пароли не совпадают</span>
      }
    </label>

    <label class="reset-form__reveal">
      <input type="checkbox" [checked]="showPassword()" (change)="showPassword.set(!showPassword())" />
      Показать пароли
    </label>

    <ul class="reset-form__rules">
      @for (rule of rules(); track rule.key) {
        <li [class.is-passed]="rule.passed">
          <i class="pi" [class.pi-check-circle]="rule.passed" [class.pi-circle]="!rule.passed"></i>
          {{ rule.label }}
        </li>
      }
    </ul>

    <button class="btn btn--primary btn--block" type="submit" [disabled]="submitting() || !resetToken">
      @if (submitting()) {
        <i class="pi pi-spinner pi-spin"></i> Сохраняем…
      } @else {
        Сохранить пароль <i class="pi pi-arrow-right"></i>
      }
    </button>

    <div class="reset-form__aside">
      Вспомнили пароль? <a routerLink="/login">Войти</a>
    </div>
  </form>
</app-auth-card>
