<div class="admin-table-wrap card">
  <table class="admin-table">
    <thead>
      <tr>
        <th>ФИО</th>
        <th>Логин</th>
        <th>Email</th>
        <th>Телефон</th>
        <th>Роль</th>
        <th>Регистрация</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td class="admin-table__sku">{{ user.fullName }}</td>
          <td>{{ user.login }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.phone ?? '—' }}</td>
          <td>
            <span class="admin-chip" [class.admin-chip--admin]="user.role === 'admin'">
              {{ user.role === 'admin' ? 'Администратор' : 'Покупатель' }}
            </span>
          </td>
          <td>{{ user.createdAt | ruDate }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="admin-table__empty">Пользователей нет</td>
        </tr>
      }
    </tbody>
  </table>
</div>
